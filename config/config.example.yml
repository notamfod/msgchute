http:
  addr: ${APP_HTTP_ADDR}
  withSwagger: false
  dashboard: ./dashboard
  config:
    readTimeout: ${APP_HTTP_READ_TIMEOUT|1s}
    readHeaderTimeout: ${APP_HTTP_READ_HEADER_TIMEOUT|1s}
    writeTimeout: ${APP_HTTP_WRITE_TIMEOUT|2s}
  tls:
    cert: ${APP_HTTP_TLS_CERT}
    key: ${APP_HTTP_TLS_KEY}
auth:
  plugin:
  params:
    adminToken:
    publicToken:
db:
  dsn: ${APP_DB_DSN}
  driver: ${APP_DB_DRIVER|pgx}
  migrationDir: ${APP_DB_MIGRATION_DIR|./migrations}
providers:
  maxBufferSize: 1000
  fetchTaskTimeout: 2s
  fetchTaskTimeoutMax: 60s
  pluginMap:
    telegram: ./plugins/dist/providers/tg
    smtp: ./plugins/dist/providers/smtp
  providers:
    gmail:
      provider: smtp
      settings:
        workers:
          min: 2
          max: 6
        breaker:
          windowSize: 10m
          minRequests: 100
          failureThreshold: 0.5
          timeout: 5m
      params:
        host: smtp.gmail.com
        port: 587
        user: user
        password: password
        from: mail@example.com
    tg:
      provider: telegram
      onboarding:
        enabled: ${APP_MESSENGER_ONBOARDING_ENABLED|false}
        botID: "${APP_TELEGRAM_BOT_ID|}"
        smsTransport: beeline
        connectURL: https://mircli.ru/notification/connect/tg
      settings:
        workers:
          min: 2
          max: 2
        breaker:
          windowSize: 10m
          minRequests: 100
          failureThreshold: 0.3
          timeout: 5m
      params:
        token:
