info:
  contact: {}
  description: HTTP API for send any messages
  title: Notification service API
  version: "1.0"
paths:
  /api/admin/v1/dictionary/message:
    get:
      consumes:
      - application/json
      description: Returns historical sender and template filters with transports
        from configured delivery profiles.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully returned dictionary data
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_internal_dto.MessageDictionaries'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
      summary: Get message dictionaries
      tags:
      - admin.dictionaries
  /api/admin/v1/dictionary/message-recipients:
    get:
      consumes:
      - application/json
      description: |-
        Returns historical recipient filter suggestions from stored messages, not recipient types or an address book.
        If the `search` parameter is provided, the result is filtered by case‑insensitive substring match.
      parameters:
      - description: Search substring to filter recipients (case‑insensitive). If
          empty, all recipients are returned.
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of recipient addresses
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
      summary: Get recipients list
      tags:
      - admin.messages
  /api/admin/v1/message:
    get:
      consumes:
      - application/x-www-form-urlencoded
      description: Retrieves a paginated list of messages filtered by status, IDs,
        recipients, senders, codes, or transports.
      parameters:
      - default: 1
        description: Page number for pagination
        in: query
        name: page
        type: integer
      - default: 10
        description: Number of items per page
        in: query
        name: per_page
        type: integer
      - description: Field to sort by
        in: query
        name: sort
        type: string
      - description: Sort order direction (asc/desc)
        in: query
        name: order
        type: string
      - collectionFormat: multi
        description: Filter by message status array
        in: query
        items:
          type: string
        name: status
        type: array
      - collectionFormat: multi
        description: Filter by message UUID array
        in: query
        items:
          type: string
        name: ids
        type: array
      - collectionFormat: multi
        description: Filter by recipient array
        in: query
        items:
          type: string
        name: recipient
        type: array
      - collectionFormat: multi
        description: Filter by sender ID array
        in: query
        items:
          type: string
        name: sender_ids
        type: array
      - collectionFormat: multi
        description: Filter by message code array
        in: query
        items:
          type: string
        name: code
        type: array
      - collectionFormat: multi
        description: Filter by transport type array
        in: query
        items:
          type: string
        name: transport
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: List of filtered messages with pagination metadata
          schema:
            $ref: '#/definitions/internal_io_web_endpoint_admin.MessageFinderResponse'
        "400":
          description: Invalid query parameters or form parsing failure
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
        "500":
          description: Internal server error while searching for records
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
      summary: List and filter messages
      tags:
      - admin.messages
  /api/admin/v1/message/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves full message details for a specific record via its UUID.
      parameters:
      - description: Unique message UUID identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Detailed structural message metadata
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_internal_dto.FullMessageInfo'
        "400":
          description: Invalid or malformed UUID parameter format
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
        "500":
          description: Internal server error or record resolution failure
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
      summary: Get message by ID
      tags:
      - admin.messages
  /api/admin/v1/template:
    get:
      consumes:
      - application/x-www-form-urlencoded
      description: Retrieves a paginated collection of message templates filtered
        by system code arrays or full-text query matches.
      parameters:
      - default: 1
        description: Page index parameter
        in: query
        name: page
        type: integer
      - default: 10
        description: Page item capacity limit
        in: query
        name: per_page
        type: integer
      - description: Target field criteria for ordering records
        in: query
        name: sort
        type: string
      - description: Ascending or descending order selection (asc/desc)
        in: query
        name: order
        type: string
      - collectionFormat: multi
        description: Filter metrics by unique message system code tokens
        in: query
        items:
          type: string
        name: code
        type: array
      - description: Generic phrase match expression matching structural text
        in: query
        name: search
        type: string
      - collectionFormat: multi
        description: System tags (match any)
        in: query
        items:
          type: string
        name: system
        type: array
      - collectionFormat: multi
        description: Channel tags (match any)
        in: query
        items:
          type: string
        name: channel
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Key-value dictionary mapping matching code IDs to schema definitions
          schema:
            $ref: '#/definitions/internal_io_web_endpoint_admin.TemplateFinderResult'
        "400":
          description: Query validation or structured query parameter parse errors
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
        "500":
          description: Internal catalog resolution context errors
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
      summary: List and filter templates
      tags:
      - admin.templates
    post:
      consumes:
      - application/json
      description: Creates and stores a completely new message configuration blueprint
        in the repository.
      parameters:
      - description: Structural definition specification metrics payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_devian2011_msgchute_internal_dto.Template'
      produces:
      - application/json
      responses:
        "200":
          description: Newly registered template model confirmation metadata
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_internal_dto.Template'
        "400":
          description: Corrupted JSON payload body formatting syntax exception
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
        "500":
          description: Persistence system errors encountered storing details
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
      summary: Create a template
      tags:
      - admin.templates
  /api/admin/v1/template/{code}:
    put:
      consumes:
      - application/json
      description: Modifies variables, subjects, or raw body layouts of an existing
        layout found by its explicit target code route component.
      parameters:
      - description: Target identifying tracking code token context
        in: path
        name: code
        required: true
        type: string
      - description: Updatable structural model fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_devian2011_msgchute_internal_dto.Template'
      produces:
      - application/json
      responses:
        "200":
          description: Refreshed schema specifications entry state details
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_internal_dto.Template'
        "400":
          description: Invalid path payload reference parameters or corrupt body markup
            values
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
        "500":
          description: Database or engine exceptions processing modified models
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
      summary: Update a template
      tags:
      - admin.templates
  /api/v1/batch/send:
    post:
      consumes:
      - application/json
      description: Accepts an array of message payloads, processes their delivery,
        and registers tracking tasks for each.
      parameters:
      - description: List of messages to be processed and sent
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/internal_io_web_endpoint_public.SenderMessageRequest'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: Messages processed and delivery tasks created successfully
          schema:
            items:
              $ref: '#/definitions/github_com_devian2011_msgchute_internal_dto.AddBatchMessageResponse'
            type: array
        "400":
          description: Invalid JSON payload or structural error
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
        "500":
          description: Internal server error during processing or delivery dispatch
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
      summary: Send multiple messages
      tags:
      - public.messages
  /api/v1/enums:
    get:
      description: |-
        Returns configured transport profiles and valid message, recipient, and subscription codes.
        Omitting a message tag applies only the full opt-out check. Tagged TG and MAX delivery is not currently supported.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_io_web_endpoint_public.Enums'
              type: object
      summary: List API reference enums
      tags:
      - public.messages
  /api/v1/message/retry:
    post:
      consumes:
      - application/json
      description: Creates a new task to retry a previously failed or pending message.
        It allows overriding retry policy and schedule.
      parameters:
      - description: Retry request parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_devian2011_msgchute_internal_dto.MessageRetryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Message and task details
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_internal_dto.AddMessageResponse'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
      summary: Retry a message
      tags:
      - public.messages
  /api/v1/preview:
    post:
      consumes:
      - application/json
      description: Accepts a raw message template along with dynamic parameters, renders
        them, and returns the final subject and body preview.
      parameters:
      - description: Message template definition and rendering context
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_io_web_endpoint_public.PreviewMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Template successfully rendered
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_internal_dto.MessagePreview'
        "400":
          description: Invalid JSON payload or syntax error
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
        "500":
          description: Internal server error during template rendering
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
      summary: Preview message
      tags:
      - public.messages
  /api/v1/send:
    post:
      consumes:
      - application/json
      description: Accepts a message payload, processes its delivery, and registers
        the tracking task.
      parameters:
      - description: Message details to be processed and sent
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_io_web_endpoint_public.SenderMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Message processed and delivery task created successfully
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_internal_dto.AddMessageResponse'
        "400":
          description: Invalid JSON payload or structural error
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
        "500":
          description: Internal server error during processing or delivery dispatch
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
      summary: Send message
      tags:
      - public.messages
  /api/v1/templates/{code}/metadata:
    patch:
      consumes:
      - application/json
      description: Objects merge recursively, null deletes keys, arrays and scalars
        replace values. No per-client ownership enforcement.
      parameters:
      - description: Stable template code
        in: path
        name: code
        required: true
        type: string
      - description: Metadata merge patch, maximum 64 KiB
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_devian2011_msgchute_internal_dto.TemplateMetadata'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_devian2011_msgchute_internal_dto.TemplateMetadata'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_devian2011_msgchute_pkg_http_response.Response'
        "404":
          description: Not Found
